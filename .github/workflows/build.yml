name: Build Minis IPA

on:
  workflow_dispatch:

jobs:
  reverse-toolchain:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 恢复已验证的内置工具链缓存
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: toolchain-out
          key: reverse-alpine321-aarch64-v2-${{ hashFiles('deps/build_reverse_toolchain.sh', 'deps/test_reverse_toolchain.py') }}
      - name: 在 Linux ARM64 编译并执行功能测试
        if: steps.tools-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchain-out
          docker create --name minis-reverse --platform linux/arm64 alpine:3.21 /bin/sh /root/build-reverse.sh
          collect_diagnostics() {
            mkdir -p toolchain-diagnostics
            docker logs minis-reverse > toolchain-diagnostics/container.log 2>&1 || true
            docker cp minis-reverse:/opt/minis-reverse toolchain-diagnostics/report || true
            docker rm -f minis-reverse >/dev/null 2>&1 || true
          }
          trap collect_diagnostics EXIT
          docker cp deps/build_reverse_toolchain.sh minis-reverse:/root/build-reverse.sh
          docker cp deps/test_reverse_toolchain.py minis-reverse:/root/test-reverse.py
          # Script is available before the build, including after apk cleanup.
          docker cp deps/test_reverse_toolchain.py minis-reverse:/tmp/test-reverse.py
          docker start --attach minis-reverse
          test "$(docker inspect -f '{{.State.ExitCode}}' minis-reverse)" = 0
          docker cp minis-reverse:/opt/minis-reverse toolchain-out/report
          docker export minis-reverse | gzip -1 > toolchain-out/alpine-tools-aarch64.tar.gz
          test -s toolchain-out/alpine-tools-aarch64.tar.gz
      - name: 保留失败时的完整诊断报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-diagnostics
          path: toolchain-diagnostics
          if-no-files-found: ignore
          retention-days: 7
      - name: 上传通过功能测试的 rootfs
        uses: actions/upload-artifact@v4
        with:
          name: alpine-tools-aarch64
          path: toolchain-out
          if-no-files-found: error
          retention-days: 7
  build:
    needs: reverse-toolchain
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - name: 检出代码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 下载通过功能测试的内置工具链
        uses: actions/download-artifact@v4
        with:
          name: alpine-tools-aarch64
          path: toolchain-out

      - name: 选择最新版 Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: 快速检查 Swift 语法
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun swiftc -frontend -parse -target arm64-apple-ios16.0 -sdk "$SDK" \
            src/ios/Views/Settings/AppAnalysisSettingsView.swift \
            src/ios/Agent/Chat/AIChatViewModel+ReverseTools.swift \
            src/ios/Agent/Chat/AIChatViewModel+ConcurrentTools.swift \
            src/ios/Agent/Chat/AIChatViewModel+ToolDefinitions.swift \
            src/ios/iSH/RootfsManager.swift

      - name: 安装构建工具
        run: |
          brew install ninja llvm libarchive pkg-config meson lld ldid

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: 初始化配置文件
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig

      - name: 品牌改名为 KyTuT
        run: |
          # 1. 桌面显示名
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string KyTuT" src/ios/Info.plist
          # 2. 权限弹窗文案 + About 页（仅显示文本，不动 bundle ID / App Group / URL scheme）
          sed -i '' 's/Minis/KyTuT/g' src/ios/Info.plist src/ios/Views/Settings/AboutView.swift
          for f in src/ios/*.lproj/InfoPlist.strings; do
            sed -i '' 's/Minis/KyTuT/g' "$f"
          done
          # 3. 三个扩展的显示名（若存在则改）
          for p in src/ios/ShareExtension/Info.plist src/ios/AgentWidget/Info.plist src/ios/FileProvider/Info.plist; do
            if /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$p" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName KyTuT" "$p"
            fi
            sed -i '' 's/Minis/KyTuT/g' "$p"
          done
          # 4. 本地化文案（界面里所有 "Minis" 显示文本）
          #    只改 value 里的显示文本，不动键名与 bundle ID / App Group /
          #    URL scheme（那些是小写 openminis，不受大写 Minis 替换影响）。
          if [ -f src/ios/Localizable.xcstrings ]; then
            sed -i '' 's/"value" : "\([^"]*\)Minis\([^"]*\)"/"value" : "\1KyTuT\2"/g' src/ios/Localizable.xcstrings
            echo "xcstrings 剩余 Minis 显示文本: $(grep -c '"value" : "[^"]*Minis' src/ios/Localizable.xcstrings || true)"
          fi

          # 5. 启动页与欢迎页
          [ -f "src/ios/Launch Screen.storyboard" ] && \
            sed -i '' 's/Open Minis/KyTuT/g' "src/ios/Launch Screen.storyboard"

          echo "=== 改名结果抽查 ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" src/ios/Info.plist
          grep -m1 "KyTuT" src/ios/Views/Settings/AboutView.swift
          grep -m1 -o 'text="KyTuT"' "src/ios/Launch Screen.storyboard" || true

      - name: 修补 VDSO 链接器（Homebrew LLVM 已拆分 lld）
        run: |
          LDP=$(ls /opt/homebrew/opt/llvm/bin/ld.lld /opt/homebrew/opt/lld/bin/ld.lld 2>/dev/null | head -1)
          if [ -z "$LDP" ]; then
            brew install lld
            LDP=/opt/homebrew/opt/lld/bin/ld.lld
          fi
          echo "使用 ld.lld: $LDP"
          sed -i '' "s#'-fuse-ld=lld'#'--ld-path=$LDP'#" deps/ish/vdso/arm64/meson.build
          grep -n "ld-path" deps/ish/vdso/arm64/meson.build

      - name: 缓存第三方依赖产物（FFmpeg / LAME / iSH / Rclone / proot）
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            deps/frameworks
            deps/libs
            deps/include
            deps/resources
            deps/lame-build
            deps/build
            build/framework
            deps/ish/build-ios
            deps/ish/build-native
            deps/ffmpeg/build-ios
            deps/lame-3.100
          key: deps-ios-${{ runner.os }}-${{ hashFiles('deps/build_*.sh', 'deps/*.patch', 'deps/ish', 'deps/proot') }}
          restore-keys: |
            deps-ios-${{ runner.os }}-

      - name: 缓存 SwiftPM 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('src/ios/Minis.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: 缓存 Homebrew 与工具链
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar
          key: brew-${{ runner.os }}-ninja-llvm-meson-lld-ldid
          restore-keys: |
            brew-${{ runner.os }}-

      - name: 编译 LAME
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./deps/build_lame.sh

      - name: 编译 FFmpeg
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./deps/build_ffmpeg.sh

      - name: 编译 iSH 内核
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./deps/build_ish.sh

      - name: 准备 Alpine rootfs（含逆向工具链预装）
        timeout-minutes: 90
        run: |
          PREBUILT_ROOTFS_TAR="$GITHUB_WORKSPACE/toolchain-out/alpine-tools-aarch64.tar.gz" bash ./deps/prepare_alpine_rootfs.sh
          echo "=== rootfs 体积 ==="
          du -sh deps/resources/alpine-rootfs

      - name: 编译 Rclone
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./deps/build_rclone_ios.sh

      - name: 编译逆向注入组件
        run: |
          chmod +x src/ios/Reverse/Inject/build_inject_components.sh
          bash src/ios/Reverse/Inject/build_inject_components.sh "$RUNNER_TEMP/inject-components"
          echo "=== 编译产物 ==="
          ls -la "$RUNNER_TEMP/inject-components" || true
          # 合并进待打包目录（编译产物覆盖预置二进制）
          mkdir -p src/ios/Resources/Reverse
          cp -f "$RUNNER_TEMP/inject-components"/* src/ios/Resources/Reverse/ 2>/dev/null || true
          ls -la src/ios/Resources/Reverse/

      - name: 编译 Minis 主程序
        run: |
          xcodebuild -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: ldid 签名（扩展 entitlements：原版权限 + 逆向权限）
        run: |
          APP="build/Build/Products/Release-iphoneos/Minis.app"
          # 主程序：原版权限 + no-sandbox / 容器读取 / LSApplicationWorkspace 枚举
          ldid -Ssrc/ios/Minis-Extended.entitlements "$APP/Minis"
          # 扩展：App Group 权限（三个扩展原文件内容一致）
          cat > /tmp/ext.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.application-groups</key>
              <array>
                  <string>group.com.openminis.app</string>
              </array>
          </dict>
          </plist>
          PLIST
          find "$APP/PlugIns" -maxdepth 1 -name "*.appex" | while read appex; do
            exe=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$appex/Info.plist")
            echo "签名: $appex/$exe"
            ldid -S/tmp/ext.entitlements "$appex/$exe"
          done

          # PacketTunnel 扩展：需要 NetworkExtension 权限，单独用它的 entitlements 签名
          PT_APPEX="$APP/PlugIns/PacketTunnel.appex"
          if [ -d "$PT_APPEX" ]; then
            ldid -Ssrc/ios/PacketTunnel/PacketTunnel.entitlements "$PT_APPEX/PacketTunnel"
            echo "已签名: PacketTunnel.appex"
          else
            echo "警告: PacketTunnel.appex 不存在"
          fi

          # TunnelServices.framework 内嵌签名
          TS_FW="$APP/Frameworks/TunnelServices.framework"
          if [ -d "$TS_FW" ]; then
            ldid -S "$TS_FW/TunnelServices"
            echo "已签名: TunnelServices.framework"
          fi
          # 打印签名摘要供核对
          ldid -e "$APP/Minis" | head -20

      - name: 注入辅助工具打包进 App bundle
        run: |
          APP="build/Build/Products/Release-iphoneos/Minis.app"
          SRC="src/ios/Resources/Reverse"

          # 这些工具必须在 bundle 内以可执行文件形式存在（root 子进程要 exec 它们），
          # 直接拷贝到 .app 根目录 —— 与 FuckDynamicInjector 里
          # FuckResourcePath(name) = [NSBundle.mainBundle.resourcePath]/name 的查找约定一致。
          count=0
          for f in "$SRC"/*; do
            base="$(basename "$f")"
            cp -f "$f" "$APP/$base"
            case "$base" in
              *.dylib) chmod 0644 "$APP/$base" ;;
              *)       chmod 0755 "$APP/$base" ;;
            esac
            count=$((count+1))
          done
          echo "已拷贝 $count 个文件到 App bundle"

          # 同样拷进 CydiaSubstrate 框架包（若工程资源未自带）
          if [ -f "$SRC/../Reverse/CydiaSubstrate.framework.zip" ] && \
             [ ! -d "$APP/CydiaSubstrate.framework" ]; then
            echo "提示: CydiaSubstrate.framework.zip 需在运行时解压，保留 zip 即可"
          fi

          echo "=== bundle 内注入组件抽查 ==="
          ls -la "$APP" | grep -E "opainject|ldid|ct_bypass|FuckKfdHelper|insert_dylib|optool|trollstorehelper" || true

      - name: 打包 IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/Minis.app"
          ls -la "build/Build/Products/Release-iphoneos/"
          ls -la "$APP/PlugIns/" 2>/dev/null || echo "(无 PlugIns)"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Minis-TrollStore.ipa Payload
          ls -lh Minis-TrollStore.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Minis-TrollStore-IPA
          path: Minis-TrollStore.ipa
