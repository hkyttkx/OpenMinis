name: Build Minis IPA

on:
  workflow_dispatch:

jobs:
  reverse-toolchain:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 恢复已验证的内置工具链缓存
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: toolchain-out
          key: reverse-alpine321-aarch64-v2-${{ hashFiles('deps/build_reverse_toolchain.sh') }}
      - name: 在 Linux ARM64 编译并执行功能测试
        if: steps.tools-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchain-out
          docker create --name minis-reverse --platform linux/arm64 alpine:3.21 /bin/sh /root/build-reverse.sh
          trap 'docker rm -f minis-reverse >/dev/null 2>&1 || true' EXIT
          docker cp deps/build_reverse_toolchain.sh minis-reverse:/root/build-reverse.sh
          docker start --attach minis-reverse
          test "$(docker inspect -f '{{.State.ExitCode}}' minis-reverse)" = 0
          docker cp minis-reverse:/opt/minis-reverse toolchain-out/report
          docker export minis-reverse | gzip -1 > toolchain-out/alpine-tools-aarch64.tar.gz
          test -s toolchain-out/alpine-tools-aarch64.tar.gz
      - name: 上传通过功能测试的 rootfs
        uses: actions/upload-artifact@v4
        with:
          name: alpine-tools-aarch64
          path: toolchain-out
          if-no-files-found: error
          retention-days: 7
  build:
    needs: reverse-toolchain
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - name: 检出代码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 下载通过功能测试的内置工具链
        uses: actions/download-artifact@v4
        with:
          name: alpine-tools-aarch64
          path: toolchain-out

      - name: 选择最新版 Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: 快速检查 Swift 语法
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun swiftc -frontend -parse -target arm64-apple-ios16.0 -sdk "$SDK" \
            src/ios/Views/Settings/AppAnalysisSettingsView.swift \
            src/ios/Agent/Chat/AIChatViewModel+ReverseTools.swift \
            src/ios/Agent/Chat/AIChatViewModel+ConcurrentTools.swift \
            src/ios/Agent/Chat/AIChatViewModel+ToolDefinitions.swift \
            src/ios/iSH/RootfsManager.swift

      - name: 安装构建工具
        run: |
          brew install ninja llvm libarchive pkg-config meson lld ldid

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: 初始化配置文件
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig

      - name: 品牌改名为 KyTuT
        run: |
          # 1. 桌面显示名
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string KyTuT" src/ios/Info.plist
          # 2. 权限弹窗文案 + About 页（仅显示文本，不动 bundle ID / App Group / URL scheme）
          sed -i '' 's/Minis/KyTuT/g' src/ios/Info.plist src/ios/Views/Settings/AboutView.swift
          for f in src/ios/*.lproj/InfoPlist.strings; do
            sed -i '' 's/Minis/KyTuT/g' "$f"
          done
          # 3. 三个扩展的显示名（若存在则改）
          for p in src/ios/ShareExtension/Info.plist src/ios/AgentWidget/Info.plist src/ios/FileProvider/Info.plist; do
            if /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$p" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName KyTuT" "$p"
            fi
            sed -i '' 's/Minis/KyTuT/g' "$p"
          done
          echo "=== 改名结果抽查 ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" src/ios/Info.plist
          grep -m1 "KyTuT" src/ios/Views/Settings/AboutView.swift

      - name: 修补 VDSO 链接器（Homebrew LLVM 已拆分 lld）
        run: |
          LDP=$(ls /opt/homebrew/opt/llvm/bin/ld.lld /opt/homebrew/opt/lld/bin/ld.lld 2>/dev/null | head -1)
          if [ -z "$LDP" ]; then
            brew install lld
            LDP=/opt/homebrew/opt/lld/bin/ld.lld
          fi
          echo "使用 ld.lld: $LDP"
          sed -i '' "s#'-fuse-ld=lld'#'--ld-path=$LDP'#" deps/ish/vdso/arm64/meson.build
          grep -n "ld-path" deps/ish/vdso/arm64/meson.build

      - name: 编译 LAME
        run: ./deps/build_lame.sh

      - name: 编译 FFmpeg
        run: ./deps/build_ffmpeg.sh

      - name: 编译 iSH 内核
        run: ./deps/build_ish.sh

      - name: 准备 Alpine rootfs（含逆向工具链预装）
        timeout-minutes: 90
        run: |
          PREBUILT_ROOTFS_TAR="$GITHUB_WORKSPACE/toolchain-out/alpine-tools-aarch64.tar.gz" bash ./deps/prepare_alpine_rootfs.sh
          echo "=== rootfs 体积 ==="
          du -sh deps/resources/alpine-rootfs

      - name: 编译 Rclone
        run: ./deps/build_rclone_ios.sh

      - name: 编译 Minis 主程序
        run: |
          xcodebuild -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: ldid 签名（扩展 entitlements：原版权限 + 逆向权限）
        run: |
          APP="build/Build/Products/Release-iphoneos/Minis.app"
          # 主程序：原版权限 + no-sandbox / 容器读取 / LSApplicationWorkspace 枚举
          ldid -Ssrc/ios/Minis-Extended.entitlements "$APP/Minis"
          # 扩展：App Group 权限（三个扩展原文件内容一致）
          cat > /tmp/ext.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.application-groups</key>
              <array>
                  <string>group.com.openminis.app</string>
              </array>
          </dict>
          </plist>
          PLIST
          find "$APP/PlugIns" -maxdepth 1 -name "*.appex" | while read appex; do
            exe=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$appex/Info.plist")
            echo "签名: $appex/$exe"
            ldid -S/tmp/ext.entitlements "$appex/$exe"
          done
          # 打印签名摘要供核对
          ldid -e "$APP/Minis" | head -20

      - name: 打包 IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/Minis.app"
          ls -la "build/Build/Products/Release-iphoneos/"
          ls -la "$APP/PlugIns/" 2>/dev/null || echo "(无 PlugIns)"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Minis-TrollStore.ipa Payload
          ls -lh Minis-TrollStore.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Minis-TrollStore-IPA
          path: Minis-TrollStore.ipa
